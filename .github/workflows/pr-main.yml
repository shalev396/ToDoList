# PR to main: lint, build, then tests against the live QA environment
name: PR to Main

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'postman/**'
      - '.github/workflows/**'
      # The agent plugin and its marketplace: a plugin-only PR must still run the required checks,
      # or the ruleset blocks it waiting for them.
      - 'agent-plugin/**'
      - '.claude-plugin/**'

permissions:
  id-token: write # _test-qa.yml resets QA through the OIDC role
  contents: read

jobs:
  lint-build:
    name: Lint & Build
    uses: ./.github/workflows/_lint-build.yml

  test:
    name: Test
    needs: lint-build
    uses: ./.github/workflows/_test-qa.yml
    secrets: inherit
