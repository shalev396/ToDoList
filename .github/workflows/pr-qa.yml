# PR to qa: lint, build, then local tests (local API + Postman + Playwright)
name: PR to QA

on:
  pull_request:
    branches: [qa]
    paths:
      - 'client/**'
      - 'server/**'
      - 'postman/**'
      - '.github/workflows/**'
      # The agent plugin and its marketplace: a plugin-only PR must still run the required checks,
      # or the ruleset blocks it waiting for them.
      - 'agent-plugin/**'
      - '.claude-plugin/**'

permissions:
  id-token: write
  contents: read

jobs:
  lint-build:
    name: Lint & Build
    uses: ./.github/workflows/_lint-build.yml

  test:
    name: Test
    needs: lint-build
    uses: ./.github/workflows/_test-local.yml
    secrets: inherit
    with:
      environment: qa
