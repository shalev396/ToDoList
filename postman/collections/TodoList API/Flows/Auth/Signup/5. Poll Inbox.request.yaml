$kind: http-request
url: https://api.mail.tm/messages
method: GET
auth:
  type: inherit
  credentials:
    id: c77fdf1d-2d72-4d5b-8112-f48266aefdfc
scripts:
  - type: beforeRequest
    code: >-
      // mail.tm rate-limit guard (same in every mail.tm request; see postman/README.md)

      {
          const mtLast = parseInt(pm.collectionVariables.get('mailtmLastCallAt') || '0', 10) || 0;
          const mtWait = Math.min(1500, 1500 - (Date.now() - mtLast));
          const mtStart = Date.now();
          while (Date.now() - mtStart < mtWait) { /* block */ }
          pm.collectionVariables.set('mailtmLastCallAt', String(Date.now()));
      }

      const retries = parseInt(pm.collectionVariables.get('pollRetryCount') || '0', 10);
      const delayMs = retries === 0 ? 12000 : 5000;
      const start = Date.now();
      while (Date.now() - start < delayMs) { /* block */ }
      if (retries === 0) {
        console.log('Waiting 12s for email delivery before first poll...');
      } else {
        console.log('Waiting 5s before retry ' + retries + '...');
      }
    language: text/javascript
  - type: afterResponse
    code: >-
      // mail.tm rate-limit guard (same in every mail.tm request; see postman/README.md)

      {
          const mtKey = 'mailtm429:' + pm.info.requestName;
          const mtCount = parseInt(pm.collectionVariables.get(mtKey) || '0', 10) || 0;
          let mtRetrying = false;
          if (pm.response.code === 429 && mtCount < 5) {
              const mtRetryAfter = String(pm.response.headers.get('Retry-After') || '').trim();
              const mtWaitSec = /^\d+$/.test(mtRetryAfter) && parseInt(mtRetryAfter, 10) <= 60 ? parseInt(mtRetryAfter, 10) : [2, 4, 8, 16, 30][mtCount];
              console.log('mail.tm 429 on "' + pm.info.requestName + '", retry ' + (mtCount + 1) + '/5 after ' + mtWaitSec + 's');
              const mtStart = Date.now();
              while (Date.now() - mtStart < mtWaitSec * 1000) { /* block */ }
              pm.collectionVariables.set(mtKey, String(mtCount + 1));
              if (typeof pm.execution !== 'undefined' && pm.execution.setNextRequest) {
                  pm.execution.setNextRequest(pm.info.requestName);
                  mtRetrying = true;
              } else if (typeof postman !== 'undefined' && postman.setNextRequest) {
                  postman.setNextRequest(pm.info.requestName);
                  mtRetrying = true;
              }
          }
          if (!mtRetrying) pm.collectionVariables.unset(mtKey);
          pm.collectionVariables.set('mailtmRetrying', mtRetrying ? '1' : '0');
      }

      if (pm.response.code !== 429 || pm.collectionVariables.get('mailtmRetrying') !== '1') {
          pm.test('Status code is 200', function () {
              pm.response.to.have.status(200);
          });

          const json = pm.response.json();
          const messages = json['hydra:member'] || [];
          const maxPollRetries = 6;
          const retries = parseInt(pm.collectionVariables.get('pollRetryCount') || '0', 10);

          if (messages.length > 0) {
              const message = messages[0];
              pm.collectionVariables.set('mailTmMessageId', message.id);
              pm.environment.set('mailTmMessageId', message.id);
              console.log('Verification email received:', message.subject);
              pm.test('Verification email received', function () {
                  pm.expect(messages.length).to.be.greaterThan(0);
              });
          } else if (retries < maxPollRetries) {
              pm.collectionVariables.set('pollRetryCount', String(retries + 1));
              console.log('No email yet, retry ' + (retries + 1) + '/' + maxPollRetries);
              if (typeof pm.execution !== 'undefined' && pm.execution.setNextRequest) {
                  pm.execution.setNextRequest('5. Poll Inbox');
              } else if (typeof postman !== 'undefined' && postman.setNextRequest) {
                  postman.setNextRequest('5. Poll Inbox');
              } else {
                  pm.test('Verification email received', function () {
                      pm.expect.fail('No email received yet');
                  });
              }
          } else {
              pm.test('Verification email received', function () {
                  pm.expect.fail('No email received after ' + maxPollRetries + ' retries');
              });
          }
      }
    language: text/javascript
order: 5000
