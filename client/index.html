<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Home Screen web app (keep name/colors in sync with public/manifest.webmanifest) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TodoList" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Match --background in src/index.css; ThemeProvider overrides both once a theme is set -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16130e" />

    <!-- Primary Meta Tags -->
    <title>TodoList</title>
    <meta name="title" content="TodoList" />
    <meta
      name="description"
      content="TodoList puts Jira, ClickUp, Linear, Google Calendar and GitHub on one dashboard: what’s on now, what’s next and every deadline this week. Free for students who also work."
    />
    <meta
      name="keywords"
      content="todo list, students, deadlines, calendar, moodle, jira, clickup, linear, github, dashboard"
    />
    <meta name="author" content="TodoList" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__VITE_APP_URL__/" />
    <meta property="og:title" content="TodoList" />
    <meta
      property="og:description"
      content="Classes, work and deadlines on one clock. Free for students who also work."
    />
    <meta property="og:image" content="__VITE_APP_URL__/og-default.png" />
    <meta property="og:site_name" content="TodoList" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter (static for crawlers that do not run JavaScript; PageMetadata updates them) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="__VITE_APP_URL__/" />
    <meta name="twitter:title" content="TodoList" />
    <meta
      name="twitter:description"
      content="Classes, work and deadlines on one clock. Free for students who also work."
    />
    <meta name="twitter:image" content="__VITE_APP_URL__/og-default.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__VITE_APP_URL__/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
