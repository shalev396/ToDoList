[pytest]
testpaths = tests/e2e tests/mailtm_client
addopts = -v --import-mode=importlib
python_files = test_*.py *_test.py smoke.py accessibility.py visual.py responsive.py security.py performance.py critical.py translations.py ios_home_screen.py
markers =
    smoke: Smoke tests (run on every PR)
    flow: Critical user flows
    a11y: Accessibility tests
    visual: Visual regression tests
    responsive: Responsive behavior tests
    security: Security-adjacent browser checks
    performance: Performance budget tests
    cross_browser: Cross-browser tests (run with --browser firefox etc)
    email: Makes or reads a real Mail.tm inbox (a new user or mailbox, an invite email, signup and confirm). Only these tests, and the setup of the shared accounts, may call Mail.tm (conftest.py guard)
